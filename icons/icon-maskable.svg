<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable adaptive icon -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Scaled group centered inside safe zone -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)" filter="url(#shadow)">
    <!-- Top line -->
    <line x1="106" y1="160" x2="406" y2="160" stroke="url(#lineGrad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Middle line -->
    <line x1="106" y1="256" x2="306" y2="256" stroke="url(#lineGrad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Middle playhead/note indicator dot -->
    <circle cx="380" cy="256" r="34" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="380" cy="256" r="14" fill="#0284c7"/>

    <!-- Bottom line -->
    <line x1="106" y1="352" x2="356" y2="352" stroke="url(#lineGrad)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
