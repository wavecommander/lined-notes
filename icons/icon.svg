<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97742"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2e1065" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- Logo Graphics Group -->
  <svg x="96" y="96" width="320" height="320" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Top line -->
    <line x1="3" y1="6" x2="21" y2="6"/>
    <!-- Middle line with playhead / note gap -->
    <line x1="3" y1="12" x2="14.2" y2="12"/>
    <!-- Bottom line -->
    <line x1="3" y1="18" x2="18" y2="18"/>
    <!-- Note / Playhead indicator dot -->
    <circle cx="19.2" cy="12" r="2.1" fill="#ffffff" stroke="none"/>
  </svg>
</svg>
